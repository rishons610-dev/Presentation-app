<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d18">
<title>VerseView Studio - Rebuilt</title>
<style>
:root {
  --bg: #090d18;
  --panel: #111827;
  --line: #29364d;
  --text: #f8fafc;
  --muted: #94a3b8;
  --blue: #3b82f6;
  --green: #10b981;
  --red: #ef4444;
  --amber: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
.app { max-width: 1100px; margin: auto; padding: 12px; }
.top { position: sticky; top: 0; z-index: 10; background: rgba(9, 13, 24, 0.96); backdrop-filter: blur(8px); padding: 10px 0 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.brand { font-weight: 900; font-size: 1.1rem; }
.status { font-size: 11px; color: var(--green); margin-top: 2px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; border-radius: 8px; font-weight: 700; transition: opacity 0.2s; }
button:hover { opacity: 0.9; }
button:active { transform: scale(0.98); }
.output-btn { background: var(--green); color: white; padding: 8px 16px; font-size: 13px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
.tab { flex: 1 0 auto; background: transparent; color: var(--muted); padding: 10px 14px; font-size: 13px; border-radius: 8px; text-align: center; }
.tab.active { background: var(--blue); color: white; }
.panel { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.panel.active { display: block; }
label { display: block; color: #cbd5e1; font-size: 12px; font-weight: 700; margin: 12px 0 6px; }
input, select, textarea { width: 100%; background: #0b1220; color: white; border: 1px solid var(--line); border-radius: 8px; padding: 10px; outline: 0; }
textarea { min-height: 100px; resize: vertical; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { width: 100%; min-height: 42px; background: var(--blue); color: white; }
.btn.green { background: var(--green); }
.btn.red { background: var(--red); }
.btn.amber { background: var(--amber); }
.btn.secondary { background: #1e293b; color: var(--text); border: 1px solid var(--line); }
.list { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; max-height: 220px; overflow-y: auto; }
.item { padding: 10px 14px; background: #0b1422; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.item:hover { background: #132035; }
.item:last-child { border-bottom: 0; }
.empty { text-align: center; color: var(--muted); padding: 16px; font-size: 13px; }
.stage { position: relative; margin-top: 14px; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; border: 1px solid var(--line); }
.stage.full { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1000; border-radius: 0; aspect-ratio: auto; }
.stage-text { width: 88%; padding: 20px; }
.p { font-size: clamp(20px, 4vw, 44px); font-weight: 800; white-space: pre-line; text-shadow: 2px 2px 6px rgba(0,0,0,0.8); line-height: 1.25; }
.s { font-size: clamp(16px, 3vw, 30px); color: #fde047; margin-top: 12px; white-space: pre-line; text-shadow: 2px 2px 6px rgba(0,0,0,0.8); line-height: 1.25; }
.r { margin-top: 14px; color: #cbd5e1; font-size: 13px; display: inline-block; }
.r.box { background: var(--blue); color: white; padding: 6px 12px; border-radius: 6px; font-weight: 700; }
.tools { position: absolute; right: 12px; top: 12px; z-index: 2; }
.tools button { background: rgba(17, 24, 39, 0.8); color: white; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 14px; }
.preview { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.preview div { background: #0b1422; border: 1px solid var(--line); padding: 10px; border-radius: 8px; font-size: 12px; }
@media(max-width: 650px){ .grid, .preview { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <div class="brand">✦ VerseView Studio</div>
      <div class="status" id="status">● Ready</div>
    </div>
    <button class="output-btn" id="btn-output">📺 Projection Window</button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="bible">📖 Bible</button>
    <button class="tab" data-tab="songs">🎵 Songs</button>
    <button class="tab" data-tab="presets">⚡ Presets</button>
    <button class="tab" data-tab="style">🎨 Style</button>
    <button class="tab" data-tab="queue">📅 Queue</button>
  </nav>

  <!-- BIBLE PANEL -->
  <section class="panel active" id="panel-bible">
    <b>Bible Passage Selection</b>
    <div class="grid">
      <div>
        <label>Primary Version</label>
        <select id="pv"></select>
      </div>
      <div>
        <label>Secondary Version</label>
        <select id="sv"></select>
      </div>
    </div>
    <label>Passage</label>
    <select id="pass"></select>
    <div class="grid" style="margin-top:12px">
      <button class="btn amber" id="btn-show-verse">Show Verse</button>
      <button class="btn red" id="btn-blackout">Blackout</button>
    </div>
  </section>

  <!-- SONGS PANEL -->
  <section class="panel" id="panel-songs">
    <b>Song Library</b>
    <label>Search Songs</label>
    <input id="search" placeholder="Type to filter songs…">
    <div class="list" id="songlist"></div>
    
    <hr style="border-color:var(--line); margin:16px 0;">
    <b>Add / Edit Song</b>
    <label>Song Title</label>
    <input id="title" placeholder="e.g. Amazing Grace">
    <div class="grid">
      <div>
        <label>Primary Lyrics (Separate slides with empty lines)</label>
        <textarea id="lp" placeholder="Verse 1 primary lyrics..."></textarea>
      </div>
      <div>
        <label>Secondary Lyrics (Optional translated slides)</label>
        <textarea id="ls" placeholder="Verse 1 secondary lyrics..."></textarea>
      </div>
    </div>
    <button class="btn green" id="btn-save-song" style="margin-top:8px">💾 Save to Library</button>
    
    <div class="grid" style="margin-top:12px">
      <button class="btn secondary" id="btn-prev-slide">← Previous Slide</button>
      <button class="btn secondary" id="btn-next-slide">Next Slide →</button>
    </div>
    <div id="info" style="color:var(--muted); font-size:12px; margin-top:6px; text-align:center;"></div>
  </section>

  <!-- PRESETS PANEL -->
  <section class="panel" id="panel-presets">
    <b>Quick Slide Presets</b>
    <div class="grid" style="margin-top:12px">
      <button class="btn secondary preset-btn" data-p="Welcome to Service!" data-s="¡Bienvenidos al Servicio!" data-r="Opening">👋 Welcome</button>
      <button class="btn secondary preset-btn" data-p="Praise & Worship" data-s="Alabanza y Adoración" data-r="Worship">🎵 Worship</button>
      <button class="btn secondary preset-btn" data-p="Amen & Hallelujah!" data-s="¡Amén y Aleluya!" data-r="Congregational">🙌 Amen</button>
      <button class="btn secondary preset-btn" data-p="God Bless You!" data-s="¡Dios te Bendiga!" data-r="Closing">🙏 Closing</button>
    </div>
  </section>

  <!-- STYLE PANEL -->
  <section class="panel" id="panel-style">
    <b>Stage & Output Style</b>
    <label>Background Theme</label>
    <select id="bg">
      <option value="#000000">Solid Black</option>
      <option value="#0f172a">Midnight Blue</option>
      <option value="linear-gradient(135deg, #2e1065, #581c87)">Royal Purple</option>
      <option value="linear-gradient(135deg, #065f46, #0f172a)">Emerald Gradient</option>
    </select>
    <label>Font Family</label>
    <select id="font">
      <option value="system-ui, sans-serif">System Sans-Serif</option>
      <option value="Georgia, serif">Georgia Serif</option>
      <option value="'Courier New', monospace">Monospace</option>
    </select>
    <div class="grid">
      <div>
        <label>Primary Text Color</label>
        <input id="pc" type="color" value="#ffffff">
      </div>
      <div>
        <label>Secondary Text Color</label>
        <input id="sc" type="color" value="#fde047">
      </div>
    </div>
    <label>Reference Badge Style</label>
    <select id="rm">
      <option value="plain">Plain Text</option>
      <option value="box">Filled Box</option>
    </select>
  </section>

  <!-- QUEUE PANEL -->
  <section class="panel" id="panel-queue">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <b>Service Queue</b>
      <button class="btn red" id="btn-clear-queue" style="width:auto; padding:4px 10px; font-size:12px; min-height:0;">Clear All</button>
    </div>
    <p style="color:var(--muted); font-size:12px; margin-top:4px;">Click any item below to trigger live presentation.</p>
    <div class="list" id="qlist"></div>
  </section>

  <!-- STAGE PREVIEW -->
  <div class="stage" id="stage">
    <div class="tools">
      <button id="btn-fullscreen" title="Toggle Fullscreen">⛶</button>
    </div>
    <div class="stage-text">
      <div class="p" id="op">For God so loved the world…</div>
      <div class="s" id="os">Porque de tal manera amó Dios al mundo…</div>
      <div class="r" id="or">John 3:16</div>
    </div>
  </div>

  <div class="preview">
    <div><b>PRIMARY PREVIEW</b><br><span id="pp"></span></div>
    <div><b>SECONDARY PREVIEW</b><br><span id="ps"></span></div>
  </div>
</div>

<script>
(()=>{
  const $ = id => document.getElementById(id);

  const passages = {
    j316: "John 3:16",
    p231: "Psalm 23:1",
    g11: "Genesis 1:1",
    p119: "Psalm 119:105"
  };

  const versions = {
    KJV: {
      name: "King James Version",
      j316: "For God so loved the world, that he gave his only begotten Son...",
      p231: "The LORD is my shepherd; I shall not want.",
      g11: "In the beginning God created the heaven and the earth.",
      p119: "Thy word is a lamp unto my feet, and a light unto my path."
    },
    RVR: {
      name: "Reina-Valera 1960",
      j316: "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito...",
      p231: "Jehová es mi pastor; nada me faltará.",
      g11: "En el principio creó Dios los cielos y la tierra.",
      p119: "Lámpara es a mis pies tu palabra, y lumbrera a mi camino."
    }
  };

  let songs = [
    {
      title: "Amazing Grace",
      slides: [
        { p: "Amazing grace! How sweet the sound\nThat saved a wretch like me!", s: "Sublime gracia del Señor\nQue a un pecador salvó" },
        { p: "I once was lost, but now am found;\nWas blind, but now I see.", s: "Fui ciego mas hoy veo yo\nPerdido fui mas hoy" }
      ]
    }
  ];

  let currentSong = null;
  let currentSlideIdx = 0;
  let queue = [];

  // Load persistence
  try {
    const data = JSON.parse(localStorage.getItem("vsStudio"));
    if (data) {
      if (data.songs && data.songs.length) songs = data.songs;
      if (data.queue && data.queue.length) queue = data.queue;
    }
  } catch(e) {}

  const channel = ("BroadcastChannel" in window) ? new BroadcastChannel("vsStudio") : null;

  function saveData() {
    try {
      localStorage.setItem("vsStudio", JSON.stringify({ songs, queue }));
    } catch(e){}
  }

  function switchTab(targetTab) {
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === targetTab));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + targetTab));
  }

  function getStyleState() {
    return {
      bg: $("bg").value,
      font: $("font").value,
      pc: $("pc").value,
      sc: $("sc").value,
      rm: $("rm").value
    };
  }

  function applyStyle() {
    const st = getStyleState();
    const stage = $("stage");
    if (!stage) return;
    stage.style.background = st.bg;
    const textElem = stage.querySelector(".stage-text");
    if (textElem) textElem.style.fontFamily = st.font;
    $("op").style.color = st.pc;
    $("os").style.color = st.sc;
    $("or").className = "r " + (st.rm === "box" ? "box" : "");
  }

  function updateLiveDisplay(primary, secondary, ref) {
    $("op").textContent = primary || "";
    $("os").textContent = secondary || "";
    $("or").textContent = ref || "";
    $("pp").textContent = primary || "";
    $("ps").textContent = secondary || "";
    $("status").textContent = primary ? "● Live" : "● Idle";
    applyStyle();

    if (channel) {
      channel.postMessage({
        type: "live",
        p: primary,
        s: secondary,
        r: ref,
        st: getStyleState()
      });
    }
  }

  function initApp() {
    // Populate select options
    Object.entries(versions).forEach(([k, v]) => {
      $("pv").add(new Option(k + " — " + v.name, k));
      $("sv").add(new Option(k + " — " + v.name, k));
    });
    $("sv").add(new Option("None", "none"));

    Object.entries(passages).forEach(([k, v]) => {
      $("pass").add(new Option(v, k));
    });

    $("pv").value = "KJV";
    $("sv").value = "RVR";

    renderSongs();
    renderQueue();
    applyStyle();
  }

  function renderSongs() {
    const query = $("search").value.toLowerCase();
    const container = $("songlist");
    container.innerHTML = "";

    const filtered = songs.filter(s => s.title.toLowerCase().includes(query));
    filtered.forEach((song) => {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `<span><b>${song.title}</b></span><span style="font-size:12px;color:var(--muted)">${song.slides.length} slides</span>`;
      item.onclick = () => {
        currentSong = song;
        currentSlideIdx = 0;
        showCurrentSongSlide();
      };
      container.appendChild(item);
    });

    if (!container.children.length) {
      container.innerHTML = '<div class="empty">No songs found.</div>';
    }
  }

  function showCurrentSongSlide() {
    if (!currentSong || !currentSong.slides[currentSlideIdx]) return;
    const slide = currentSong.slides[currentSlideIdx];
    const ref = `${currentSong.title} (${currentSlideIdx + 1}/${currentSong.slides.length})`;
    updateLiveDisplay(slide.p, slide.s, ref);
    $("info").textContent = `${currentSong.title} • Slide ${currentSlideIdx + 1} of ${currentSong.slides.length}`;
  }

  function renderQueue() {
    const container = $("qlist");
    container.innerHTML = "";

    if (!queue.length) {
      container.innerHTML = '<div class="empty">Queue is empty.</div>';
      return;
    }

    queue.forEach((item, index) => {
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80%;">${item.r || item.p}</span>
        <button class="btn red" style="width:auto;padding:2px 8px;font-size:11px;min-height:0;" data-del="${index}">✕</button>
      `;
      el.onclick = (e) => {
        if(e.target.dataset.del !== undefined) return;
        updateLiveDisplay(item.p, item.s, item.r);
      };
      container.appendChild(el);
    });

    container.querySelectorAll("[data-del]").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.del, 10);
        queue.splice(idx, 1);
        saveData();
        renderQueue();
      };
    });
  }

  function openProjectionWindow() {
    const win = window.open(location.href.split("?")[0] + "?output=1", "VerseViewOutput", "width=1200,height=800");
    if (!win) {
      alert("Please allow pop-ups for VerseView Studio projection output window.");
      return;
    }
    setTimeout(() => {
      if (channel) {
        channel.postMessage({
          type: "live",
          p: $("op").textContent,
          s: $("os").textContent,
          r: $("or").textContent,
          st: getStyleState()
        });
      }
    }, 600);
  }

  // --- Event Listeners ---
  $("tabs").addEventListener("click", e => {
    const btn = e.target.closest("[data-tab]");
    if (btn) switchTab(btn.dataset.tab);
  });

  $("btn-show-verse").onclick = () => {
    const pv = $("pv").value;
    const sv = $("sv").value;
    const pass = $("pass").value;

    const primaryText = versions[pv][pass];
    const secondaryText = (sv === "none") ? "" : versions[sv][pass];
    const refText = passages[pass] + " (" + pv + (sv === "none" ? "" : " / " + sv) + ")";

    updateLiveDisplay(primaryText, secondaryText, refText);
    queue.push({ p: primaryText, s: secondaryText, r: refText });
    saveData();
    renderQueue();
  };

  $("btn-blackout").onclick = () => updateLiveDisplay("", "", "");
  $("btn-output").onclick = openProjectionWindow;

  $("btn-fullscreen").onclick = () => {
    const stage = $("stage");
    if (!document.fullscreenElement) {
      stage.requestFullscreen ? stage.requestFullscreen().catch(() => stage.classList.add("full")) : stage.classList.add("full");
    } else {
      document.exitFullscreen ? document.exitFullscreen() : stage.classList.remove("full");
    }
  };

  $("btn-prev-slide").onclick = () => {
    if (currentSong && currentSlideIdx > 0) {
      currentSlideIdx--;
      showCurrentSongSlide();
    }
  };

  $("btn-next-slide").onclick = () => {
    if (currentSong && currentSlideIdx < currentSong.slides.length - 1) {
      currentSlideIdx++;
      showCurrentSongSlide();
    }
  };

  $("btn-save-song").onclick = () => {
    const title = $("title").value.trim();
    const lp = $("lp").value.trim();
    const ls = $("ls").value.trim();

    if (!title || !lp) {
      alert("Please enter a title and primary lyrics.");
      return;
    }

    const pVerses = lp.split(/\n\s*\n/);
    const sVerses = ls ? ls.split(/\n\s*\n/) : [];

    const slides = pVerses.map((v, i) => ({
      p: v.trim(),
      s: (sVerses[i] || "").trim()
    }));

    songs.push({ title, slides });
    saveData();
    
    currentSong = songs[songs.length - 1];
    currentSlideIdx = 0;
    renderSongs();
    showCurrentSongSlide();

    $("title").value = "";
    $("lp").value = "";
    $("ls").value = "";
  };

  document.querySelectorAll(".preset-btn").forEach(btn => {
    btn.onclick = () => {
      const p = btn.dataset.p;
      const s = btn.dataset.s;
      const r = btn.dataset.r;
      updateLiveDisplay(p, s, r);
      queue.push({ p, s, r });
      saveData();
      renderQueue();
    };
  });

  $("btn-clear-queue").onclick = () => {
    queue = [];
    saveData();
    renderQueue();
  };

  $("search").oninput = renderSongs;

  ["bg", "font", "pc", "sc", "rm"].forEach(id => {
    $(id).oninput = () => {
      applyStyle();
      if (channel) {
        channel.postMessage({ type: "style", st: getStyleState() });
      }
    };
  });

  // --- Secondary Projection Window Logic ---
  if (new URLSearchParams(location.search).get("output") === "1") {
    document.body.innerHTML = `
      <div class="stage full" id="remote">
        <div class="stage-text">
          <div class="p" id="rp"></div>
          <div class="s" id="rs"></div>
          <div class="r" id="rr"></div>
        </div>
      </div>
    `;

    function applyRemoteStyle(st) {
      const remote = $("remote");
      if (!remote || !st) return;
      remote.style.background = st.bg;
      remote.querySelector(".stage-text").style.fontFamily = st.font;
      $("rp").style.color = st.pc;
      $("rs").style.color = st.sc;
      $("rr").className = "r " + (st.rm === "box" ? "box" : "");
    }

    if (channel) {
      channel.onmessage = e => {
        const m = e.data;
        if (m.type === "live") {
          $("rp").textContent = m.p |      padding: 0.6rem 0.2rem;
      font-size: 0.75rem;
      font-weight: bold;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 4px;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--primary) !important; color: white !important; }

    .tab-content { display: none !important; background: var(--panel); padding: 1rem; border-radius: 8px; }
    .tab-content.active { display: block !important; }

    label { display: block; font-size: 0.8rem; margin: 0.5rem 0 0.25rem; color: #cbd5e1; }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem;
      margin-bottom: 0.5rem;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.9rem;
    }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem; }

    button.action-btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.accent { background: var(--accent); }
    button.warning { background: var(--warning); }
    button.danger { background: var(--danger); }

    .song-list, .schedule-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      margin-bottom: 0.5rem;
    }
    .song-item, .schedule-item {
      padding: 0.6rem;
      border-bottom: 1px solid #1e293b;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .song-item:hover, .schedule-item:hover { background: #1e293b; }
    .song-item:last-child, .schedule-item:last-child { border-bottom: none; }
    .type-badge {
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      font-weight: bold;
    }
    .badge-song { background: var(--primary); color: #fff; }

    /* Stage Area Layout */
    #stage-wrapper {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

          { p: "Amazing grace! How sweet the sound\nThat saved a wretch like me!", s: "Sublime gracia del Señor\nQue a un pecador salvó" },

          { p: "'Twas grace that taught my heart to fear,\nAnd grace my fears relieved;", s: "Su gracia me enseñó a temer\nY m      overflow-y: auto;

<body>

  <header>
    <h2>VerseView Web Pro</h2>
    <div>
      <button onclick="openPresentationWindow()" style="width: auto; padding: 0.5rem 1rem; background: var(--accent);">
        📺 Launch Output Screen
      </button>
    </div>
  </header>

  <div class="app-container">
    <div class="sidebar">
      
      <!-- Navigation Tabs -->
      <div class="modes">
        <button id="tab-bible" class="tab-btn active" onclick="switchTab('bible')">Bible</button>
        <button id="tab-song" class="tab-btn" onclick="switchTab('song')">Songs</button>
        <button id="tab-area" class="tab-btn" onclick="switchTab('area')">Area & Display</button>
        <button id="tab-media" class="tab-btn" onclick="switchTab('media')">Media & Logo</button>
      </div>

      <!-- BIBLE SECTION -->
      <div id="section-bible" class="card">
        <h3>Bible Presentation</h3>
        <label>Primary Translation</label>
        <select id="p-lang" onchange="sendVerseToDisplay()">
          <option value="en">English (KJV)</option>
          <option value="es">Spanish (RVR)</option>
        </select>

        <label>Secondary Translation</label>
        <select id="s-lang" onchange="sendVerseToDisplay()">
          <option value="none">None</option>
          <option value="es" selected>Spanish (RVR)</option>
          <option value="en">English (KJV)</option>
        </select>

        <label>Select Verse</label>
        <select id="verse-select" onchange="sendVerseToDisplay()">
          <option value="john316">John 3:16</option>
          <option value="psalm231">Psalm 23:1</option>
          <option value="gen11">Genesis 1:1</option>
        </select>
      </div>

      <!-- SONGS SECTION -->
      <div id="section-song" class="card" style="display: none;">
        <h3>Custom Lyrics</h3>
        <label>Primary Language Slide</label>
        <textarea id="custom-p" rows="3" placeholder="Primary lyrics text..."></textarea>

        <label>Secondary Language Slide</label>
        <textarea id="custom-s" rows="3" placeholder="Secondary translation line..."></textarea>
        
        <button onclick="sendCustomLyric()">Project Live</button>
      </div>

      <!-- MARKED AREA & DISPLAY RATIO SECTION -->
      <div id="section-area" class="card" style="display: none;">
        <h3>TV / Projector Display Settings</h3>
        
        <label>Aspect Ratio Preset</label>
        <select id="aspect-ratio-select" onchange="updateDisplayRatio()">
          <option value="16/9">16:9 Widescreen (Standard TV/Projector)</option>
          <option value="4/3">4:3 Standard</option>
          <option value="fill">Stretch / Fill Screen (No Black Bars)</option>
        </select>

        <label>Manual Zoom / Overscan Fit (%)</label>
        <input type="range" id="display-scale" min="80" max="120" value="100" oninput="updateDisplayRatio()">

        <button class="accent" onclick="triggerFullscreenOutput()" style="margin-bottom:0.75rem;">Fullscreen Output Screen</button>

        <hr style="border-color: #334155; margin: 0.75rem 0;">

        <h3>Marked Output Text Area</h3>
        
        <label>Show Area Guides on Preview</label>
        <button class="warning" onclick="toggleGuides()" style="margin-bottom:0.75rem;">Toggle Area Guide Box</button>

        <div class="grid-2">
          <div>
            <label>Top Position (%)</label>
            <input type="range" id="box-top" min="0" max="80" value="10" oninput="updateBoundingBox()">
          </div>
          <div>
            <label>Left Position (%)</label>
            <input type="range" id="box-left" min="0" max="80" value="5" oninput="updateBoundingBox()">
          </div>
          <div>
            <label>Width (%)</label>
            <input type="range" id="box-width" min="20" max="100" value="90" oninput="updateBoundingBox()">
          </div>
          <div>
            <label>Height (%)</label>
            <input type="range" id="box-height" min="20" max="100" value="80" oninput="updateBoundingBox()">
          </div>
        </div>

        <hr style="border-color: #334155; margin: 0.75rem 0;">

        <h3>Custom Fonts & Colors</h3>
        <label>Font Family Selection</label>
        <select id="font-family" onchange="updateStyles()">

          <option value="Georgia, serif">Georgia (Serif)</option>
          <option value="'Courier New', monospace">Courier (Monospace)</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet</option>

        <label>Upload Custom Font File (.ttf, .otf, .woff)</label>
        <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2" onchange="uploadCustomFont(event)">

        <label>Primary Text Color</label>
        <input type="color" id="p-color" value="#ffffff" onchange="updateStyles()">

        <label>Secondary Text Color</label>
        <input type="color" id="s-color" value="#fde047" onchange="updateStyles()">
      </div>

      <!-- MEDIA & LOGO SECTION -->
      <div id="section-media" class="card" style="display: none;">
        <h3>Instant Logo Slide</h3>
        
        <div class="grid-2" style="margin-bottom: 0.75rem;">
          <button class="accent" onclick="toggleLogo(true)">Show Logo</button>
          <button class="clear" onclick="toggleLogo(false)">Hide Logo</button>
        </div>

        <label>Upload Church / Ministry Logo</label>
        <input type="file" id="logo-file" accept="image/*" onchange="uploadLogo(event)">

        <hr style="border-color: #334155; margin: 0.75rem 0;">

        <h3>Local Storage Media Backgrounds</h3>
        
        <label>Upload Custom Image Background</label>
        <input type="file" id="bg-image-file" accept="image/*" onchange="uploadBgImage(event)">

        <label>Upload Custom Video Background (MP4/WebM)</label>
        <input type="file" id="bg-video-file" accept="video/mp4,video/webm" onchange="uploadBgVideo(event)">

        <button class="clear" onclick="clearDisplay()">Clear Live Text</button>
      </div>

    <!-- Live Stage Preview -->
    <div class="main-content">
      <div id="display-stage">
        <video id="bg-video" autoplay loop muted playsinline></video>
        <div class="overlay"></div>
        <div id="logo-overlay"></div>

        <!-- Marked Text Bounding Area -->
        <div id="text-bounding-box">
          <div id="text-container">
            <div id="out-primary" class="primary-text">For God so loved the world...</div>
            <div id="out-secondary" class="secondary-text">Porque de tal manera amó Dios al mundo...</div>
            <div id="out-ref" class="reference-text">John 3:16</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sampleBibles = {
      john316: { ref: "John 3:16", en: "For God so loved the world, that he gave his only begotten Son...", es: "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito..." },
      psalm231: { ref: "Psalm 23:1", en: "The LORD is my shepherd; I shall not want.", es: "Jehová es mi pastor; nada me faltará." },
      gen11: { ref: "Genesis 1:1", en: "In the beginning God created the heaven and the earth.", es: "En el principio creó Dios los cielos y la tierra." }
    };

    const channel = new BroadcastChannel("verseview_pro_channel");

    function switchTab(mode) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      ['bible', 'song', 'area', 'media'].forEach(m => {
        document.getElementById('section-' + m).style.display = 'none';
      });

      document.getElementById('tab-' + mode).classList.add('active');
      document.getElementById('section-' + mode).style.display = 'block';
    }

    function toggleGuides() {
      document.body.classList.toggle('show-box-guides');
    }

    /* DISPLAY RATIO & FULLSCREEN LOGIC */
    function updateDisplayRatio() {
      const ratio = document.getElementById('aspect-ratio-select').value;
      const scale = document.getElementById('display-scale').value / 100;

      const data = { ratio, scale };
      applyDisplayRatio(data);
      channel.postMessage({ type: 'UPDATE_DISPLAY_RATIO', data });
    }

    function applyDisplayRatio(data) {
      const stage = document.getElementById('display-stage');
      if (!stage) return;

      if (data.ratio === 'fill') {
        stage.style.aspectRatio = 'unset';
        stage.style.width = '100vw';
        stage.style.height = '100vh';
      } else {
        stage.style.aspectRatio = data.ratio;
        stage.style.width = '100%';
        stage.style.height = 'auto';
      }

      stage.style.transform = `scale(${data.scale})`;
      autoScaleTextFont();
    }

    function triggerFullscreenOutput() {
      const stage = document.getElementById('display-stage');
      if (stage.requestFullscreen) {
        stage.requestFullscreen();
      } else if (stage.webkitRequestFullscreen) {
        stage.webkitRequestFullscreen();
      }
    }

    /* BIBLE & LYRICS LOGIC */
    function sendVerseToDisplay() {
      const selected = document.getElementById('verse-select').value;
      const pLang = document.getElementById('p-lang').value;
      const sLang = document.getElementById('s-lang').value;
      const item = sampleBibles[selected];

      const payload = {
        primary: item[pLang] || "",
        secondary: sLang !== "none" ? item[sLang] : "",
        ref: item.ref
      };

      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    function sendCustomLyric() {
      const primary = document.getElementById('custom-p').value;
      const secondary = document.getElementById('custom-s').value;

      const payload = { primary, secondary, ref: "Lyric Slide" };
      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    function clearDisplay() {
      const payload = { primary: "", secondary: "", ref: "" };
      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    /* MARKED BOUNDING BOX & AUTOMATED DYNAMIC FONT SCALING */
    function updateBoundingBox() {
      const box = {
        top: document.getElementById('box-top').value + '%',
        left: document.getElementById('box-left').value + '%',
        width: document.getElementById('box-width').value + '%',
        height: document.getElementById('box-height').value + '%'
      };

      applyBoundingBox(box);
      channel.postMessage({ type: 'UPDATE_BOX', data: box });
    }

    function applyBoundingBox(box) {
      const bbox = document.getElementById('text-bounding-box');
      bbox.style.top = box.top;
      bbox.style.left = box.left;
      bbox.style.width = box.width;
      bbox.style.height = box.height;
      autoScaleTextFont();
    }

    function autoScaleTextFont() {
      const container = document.getElementById('text-container');
      const box = document.getElementById('text-bounding-box');
      
      if (!container || !box) return;

      let fontSize = 10;
      container.style.fontSize = fontSize + 'px';

      while (
        container.scrollHeight <= box.clientHeight && 
        container.scrollWidth <= box.clientWidth && 
        fontSize < 120
      ) {
        fontSize += 2;
        container.style.fontSize = fontSize + 'px';
      }

      fontSize = Math.max(10, fontSize - 4);
      container.style.fontSize = fontSize + 'px';
    }

    /* LOCAL MEDIA & LOGO OVERLAY */
    function uploadLogo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const logoDataUrl = evt.target.result;
        document.getElementById('logo-overlay').style.backgroundImage = `url('${logoDataUrl}')`;
        channel.postMessage({ type: 'UPDATE_LOGO_SRC', data: logoDataUrl });
      };
      reader.readAsDataURL(file);
    }

    function toggleLogo(show) {
      document.getElementById('logo-overlay').style.display = show ? 'block' : 'none';
      channel.postMessage({ type: 'TOGGLE_LOGO', data: show });
    }

    function uploadBgImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const imgUrl = evt.target.result;
        const stage = document.getElementById('display-stage');
        const video = document.getElementById('bg-video');

        video.style.display = 'none';
        stage.style.backgroundImage = `url('${imgUrl}')`;

        channel.postMessage({ type: 'UPDATE_BG_IMAGE', data: imgUrl });
      };
      reader.readAsDataURL(file);
    }

    function uploadBgVideo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const videoUrl = URL.createObjectURL(file);
      const stage = document.getElementById('display-stage');
      const video = document.getElementById('bg-video');

      stage.style.backgroundImage = 'none';
      video.src = videoUrl;
      video.style.display = 'block';
      video.play();

      channel.postMessage({ type: 'UPDATE_BG_VIDEO', data: videoUrl });
    }

    /* CUSTOM FONTS & STYLING */
    function uploadCustomFont(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fontName = 'CustomFont_' + Date.now();
      const reader = new FileReader();

      reader.onload = function(evt) {
        const font = new FontFace(fontName, evt.target.result);
        font.load().then(loadedFont => {
          document.fonts.add(loadedFont);
          
          const select = document.getElementById('font-family');
          const option = new Option('Custom: ' + file.name, fontName);
          select.add(option);
          select.value = fontName;

          updateStyles();
        });
      };
      reader.readAsArrayBuffer(file);
    }

    function updateStyles() {
      const styles = {
        fontFamily: document.getElementById('font-family').value,
        pColor: document.getElementById('p-color').value,
        sColor: document.getElementById('s-color').value
      };

      applyStylesToStage(styles);
      channel.postMessage({ type: 'UPDATE_STYLES', data: styles });
    }

    function applyStylesToStage(styles) {
      const container = document.getElementById('text-container');
      const primaryText = document.getElementById('out-primary');
      const secondaryText = document.getElementById('out-secondary');

      if (styles.fontFamily) container.style.fontFamily = styles.fontFamily;
      if (styles.pColor) primaryText.style.color = styles.pColor;
      if (styles.sColor) secondaryText.style.color = styles.sColor;

      autoScaleTextFont();
    }

    function updateStage(data) {
      document.getElementById('out-primary').innerText = data.primary;
      document.getElementById('out-secondary').innerText = data.secondary;
      document.getElementById('out-ref').innerText = data.ref      overflow-y: auto;
      border-right: 1px solid #334155;
    }

    .card {
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .card h3 { font-size: 0.85rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 0.75rem; letter-spacing: 0.05em; }

    label { display: block; font-size: 0.8rem; margin-bottom: 0.25rem; color: #cbd5e1; }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 0.75rem;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 0.9rem;
    }

    button {
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 4px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.clear { background: #ef4444; }
    button.accent { background: var(--accent); }
    button.warning { background: #f59e0b; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    /* Output Stage */
    #display-stage {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
      background-color: #000;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    #bg-video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 1;
    }

    /* Target Bounding Box Area */
    #text-bounding-box {
      position: absolute;
      top: 10%; left: 5%; width: 90%; height: 80%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-sizing: border-border-box;
      border: 2px dashed dashed transparent;
    }

    body.show-box-guides #text-bounding-box {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
    }

    #text-container {
      width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      white-space: normal;
      word-break: break-word;
    }

    .primary-text {
      font-weight: bold;
      margin-bottom: 0.25em;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      line-height: 1.2;
    }

    .secondary-text {
      opacity: 0.9;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      line-height: 1.2;
    }

    .reference-text {
      margin-top: 0.5em;
      font-size: 0.4em;
      font-style: italic;
      color: #cbd5e1;
    }

    /* Logo Overlay Slide */
    #logo-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 10;
      display: none;
    }

    .modes { display: flex; gap: 0.5rem; }

    .tab-btn { flex: 1; background: #334155; padding: 0.5rem; font-size: 0.8rem; }
    .tab-btn.active { background: var(--primary); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    /* Presentation Screen Mode */
    body.presentation-mode .sidebar,
    body.presentation-mode header { display: none !important; }
    body.presentation-mode .main-content { padding: 0; }
    body.presentation-mode #display-stage {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <header>
    <h2>VerseView Web Pro</h2>
    <div>
      <button onclick="openPresentationWindow()" style="width: auto; padding: 0.5rem 1rem; background: var(--accent);">
        📺 Launch Output Screen
      </button>
    </div>
  </header>

  <div class="app-container">
    <div class="sidebar">
      
      <!-- Navigation Tabs -->
      <div class="modes">
        <button id="tab-bible" class="tab-btn active" onclick="switchTab('bible')">Bible</button>
        <button id="tab-song" class="tab-btn" onclick="switchTab('song')">Songs</button>

        <button id="tab-area" class="tab-btn" onclick="switchTab('area')">Area & Font</button>
        <button id="tab-media" class="tab-btn" onclick="switchTab('media')">Media & Logo</button>
      </div>

      <!-- BIBLE SECTION -->
      <div id="section-bible" class="card">
        <h3>Bible Presentation</h3>
        <label>Primary Translation</label>
        <select id="p-lang" onchange="loadVerses()">
          <option value="en">English (KJV)</option>
          <option value="es">Spanish (RVR)</option>
        </select>

        <label>Secondary Translation</label>

        <select id="s-lang" onchange="loadVerses()">
          <option value="none">None</option>
          <option value="es" selected>Spanish (RVR)</option>
          <option value="en">English (KJV)</option>
        </select>

        <label>Select Verse</label>

        <select id="verse-select" onchange="sendVerseToDisplay()">
          <option value="john316">John 3:16</option>
          <option value="psalm231">Psalm 23:1</option>
          <option value="gen11">Genesis 1:1</option>
        </select>
      </div>

      <!-- SONGS SECTION -->

      <div id="section-song" class="card" style="display: none;">
        <h3>Custom Lyrics</h3>
        <label>Primary Language Slide</label>
        <textarea id="custom-p" rows="3" placeholder="Primary lyrics text..."></textarea>

        <label>Secondary Language Slide</label>
        <textarea id="custom-s" rows="3" placeholder="Secondary translation line..."></textarea>

        
        <button onclick="sendCustomLyric()">Project Live</button>
      </div>

      <!-- MARKED AREA & DYNAMIC FONT SECTION -->

      <div id="section-area" class="card" style="display: none;">
        <h3>Marked Output Text Area</h3>
        
        <label>Show Area Guides on Preview</label>

        <button class="warning" onclick="toggleGuides()" style="margin-bottom:0.75rem;">Toggle Area Guide Box</button>

        <div class="grid-2">
          <div>
            <label>Top Position (%)</label>
            <input type="range" id="box-top" min="0" max="80" value="10" oninput="updateBoundingBox()">
          </div>

          <div>
            <label>Left Position (%)</label>
            <input type="range" id="box-left" min="0" max="80" value="5" oninput="updateBoundingBox()">
          </div>

          <div>
            <label>Width (%)</label>
            <input type="range" id="box-width" min="20" max="100" value="90" oninput="updateBoundingBox()">
          </div>

          <div>
            <label>Height (%)</label>
            <input type="range" id="box-height" min="20" max="100" value="80" oninput="updateBoundingBox()">
          </div>

        </div>

        <hr style="border-color: #334155; margin: 0.75rem 0;">

        <h3>Custom Fonts</h3>
        <label>Font Family Selection</label>
        <select id="font-family" onchange="updateStyles()">

          <option value="system-ui">Default System</option>
          <option value="Georgia, serif">Georgia (Serif)</option>
          <option value="'Courier New', monospace">Courier (Monospace)</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet</option>

        </select>

        <label>Upload Custom Font File (.ttf, .otf, .woff)</label>

        <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2" onchange="uploadCustomFont(event)">

        <label>Primary Text Color</label>
        <input type="color" id="p-color" value="#ffffff" onchange="updateStyles()">

        <label>Secondary Text Color</label>

        <input type="color" id="s-color" value="#fde047" onchange="updateStyles()">
      </div>

      <!-- MEDIA & LOGO SECTION -->

      <div id="section-media" class="card" style="display: none;">
        <h3>Instant Logo Slide</h3>
        
        <div class="grid-2" style="margin-bottom: 0.75rem;">
          <button class="accent" onclick="toggleLogo(true)">Show Logo</button>

          <button class="clear" onclick="toggleLogo(false)">Hide Logo</button>

        </div>

        <label>Upload Church / Ministry Logo</label>
        <input type="file" id="logo-file" accept="image/*" onchange="uploadLogo(event)">

        <hr style="border-color: #334155; margin: 0.75rem 0;">

        <h3>Local Storage Media Backgrounds</h3>
        
        <label>Upload Custom Image Background</label>

        <input type="file" id="bg-image-file" accept="image/*" onchange="uploadBgImage(event)">

        <label>Upload Custom Video Background (MP4/WebM)</label>

        <input type="file" id="bg-video-file" accept="video/mp4,video/webm" onchange="uploadBgVideo(event)">

        <button class="clear" onclick="clearDisplay()">Clear Live Text</button>

      </div>

    </div>

    <!-- Live Stage Preview -->

    <div class="main-content">
      <div id="display-stage">
        <video id="bg-video" autoplay loop muted playsinline></video>
        <div class="overlay"></div>
        <div id="logo-overlay"></div>

        <!-- Marked Text Bounding Area -->

        <div id="text-bounding-box">
          <div id="text-container">
            <div id="out-primary" class="primary-text">For God so loved the world...</div>
            <div id="out-secondary" class="secondary-text">Porque de tal manera amó Dios al mundo...</div>
            <div id="out-ref" class="reference-text">John 3:16</div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    const sampleBibles = {
      john316: { ref: "John 3:16", en: "For God so loved the world, that he gave his only begotten Son...", es: "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito..." },
      psalm231: { ref: "Psalm 23:1", en: "The LORD is my shepherd; I shall not want.", es: "Jehová es mi pastor; nada me faltará." },
      gen11: { ref: "Genesis 1:1", en: "In the beginning God created the heaven and the earth.", es: "En el principio creó Dios los cielos y la tierra." }
    };

    const channel = new BroadcastChannel("verseview_pro_channel");

    function switchTab(mode) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      ['bible', 'song', 'area', 'media'].forEach(m => {
        document.getElementById('section-' + m).style.display = 'none';
      });

      document.getElementById('tab-' + mode).classList.add('active');
      document.getElementById('section-' + mode).style.display = 'block';
    }

    function toggleGuides() {
      document.body.classList.toggle('show-box-guides');
    }

    /* BIBLE & LYRICS LOGIC */

    function sendVerseToDisplay() {
      const selected = document.getElementById('verse-select').value;
      const pLang = document.getElementById('p-lang').value;
      const sLang = document.getElementById('s-lang').value;
      const item = sampleBibles[selected];

      const payload = {
        primary: item[pLang] || "",
        secondary: sLang !== "none" ? item[sLang] : "",
        ref: item.ref
      };

      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    function sendCustomLyric() {
      const primary = document.getElementById('custom-p').value;
      const secondary = document.getElementById('custom-s').value;

      const payload = { primary, secondary, ref: "Lyric Slide" };
      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    function clearDisplay() {
      const payload = { primary: "", secondary: "", ref: "" };
      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    /* MARKED BOUNDING BOX & AUTOMATED DYNAMIC FONT SCALING */

    function updateBoundingBox() {
      const box = {
        top: document.getElementById('box-top').value + '%',
        left: document.getElementById('box-left').value + '%',
        width: document.getElementById('box-width').value + '%',
        height: document.getElementById('box-height').value + '%'
      };

      applyBoundingBox(box);
      channel.postMessage({ type: 'UPDATE_BOX', data: box });
    }

    function applyBoundingBox(box) {
      const bbox = document.getElementById('text-bounding-box');
      bbox.style.top = box.top;
      bbox.style.left = box.left;
      bbox.style.width = box.width;
      bbox.style.height = box.height;
      autoScaleTextFont();
    }

    function autoScaleTextFont() {
      const container = document.getElementById('text-container');
      const box = document.getElementById('text-bounding-box');
      
      if (!container || !box) return;

      let fontSize = 10;
      container.style.fontSize = fontSize + 'px';

      // Dynamically scale font size up until text fills box or starts overflowing
      while (
        container.scrollHeight <= box.clientHeight && 
        container.scrollWidth <= box.clientWidth && 
        fontSize < 120
      ) {
        fontSize += 2;
        container.style.fontSize = fontSize + 'px';
      }

      // Step back down slightly to prevent clipping
      fontSize = Math.max(10, fontSize - 4);
      container.style.fontSize = fontSize + 'px';
    }

    /* LOCAL MEDIA & LOGO OVERLAY */

    function uploadLogo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const logoDataUrl = evt.target.result;
        document.getElementById('logo-overlay').style.backgroundImage = `url('${logoDataUrl}')`;
        channel.postMessage({ type: 'UPDATE_LOGO_SRC', data: logoDataUrl });
      };
      reader.readAsDataURL(file);
    }

    function toggleLogo(show) {
      document.getElementById('logo-overlay').style.display = show ? 'block' : 'none';
      channel.postMessage({ type: 'TOGGLE_LOGO', data: show });
    }

    function uploadBgImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const imgUrl = evt.target.result;
        const stage = document.getElementById('display-stage');
        const video = document.getElementById('bg-video');

        video.style.display = 'none';
        stage.style.backgroundImage = `url('${imgUrl}')`;

        channel.postMessage({ type: 'UPDATE_BG_IMAGE', data: imgUrl });
      };
      reader.readAsDataURL(file);
    }

    function uploadBgVideo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const videoUrl = URL.createObjectURL(file);
      const stage = document.getElementById('display-stage');
      const video = document.getElementById('bg-video');

      stage.style.backgroundImage = 'none';
      video.src = videoUrl;
      video.style.display = 'block';
      video.play();

      channel.postMessage({ type: 'UPDATE_BG_VIDEO', data: videoUrl });
    }

    /* CUSTOM FONTS & STYLING */

    function uploadCustomFont(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fontName = 'CustomFont_' + Date.now();
      const reader = new FileReader();

      reader.onload = function(evt) {
        const font = new FontFace(fontName, evt.target.result);
        font.load().then(loadedFont => {
          document.fonts.add(loadedFont);
          
          const select = document.getElementById('font-family');
          const option = new Option('Custom: ' + file.name, fontName);
          select.add(option);
          select.value = fontName;

          updateStyles();
        });
      };
      reader.readAsArrayBuffer(file);
    }

    function updateStyles() {
      const styles = {
        fontFamily: document.getElementById('font-family').value,
        pColor: document.getElementById('p-color').value,
        sColor: document.getElementById('s-color').value
      };

      applyStylesToStage(styles);
      channel.postMessage({ type: 'UPDATE_STYLES', data: styles });
    }

    function applyStylesToStage(styles) {
      const container = document.getElementById('text-container');
      const primaryText = document.getElementById('out-primary');
      const secondaryText = document.getElementById('out-secondary');

      if (styles.fontFamily) container.style.fontFamily = styles.fontFamily;
      if (styles.pColor) primaryText.style.color = styles.pColor;
      if (styles.sColor) secondaryText.style.color = styles.sColor;

      autoScaleTextFont();
    }

    function updateStage(data) {
      document.getElementById('out-primary').innerText = data.primary;
      document.getElementById('out-secondary').innerText = data.secondary;
      document.getElementById('out-ref').innerText = data.ref;
      autoScaleTextFont();
    }

    function openPresentationWindow() {
      const url = window.location.href.split('?')[0] + '?mode=presentation';
      window.open(url, '_blank');
    }

    window.addEventListener('resize', autoScaleTextFont);

    /* CROSS-TAB SYNC LISTENER */

    channel.onmessage = (event) => {
      const { type, data } = event.data;
      if (type === 'UPDATE_CONTENT') updateStage(data);
      if (type === 'UPDATE_STYLES') applyStylesToStage(data);
      if (type === 'UPDATE_BOX') applyBoundingBox(data);
      if (type === 'TOGGLE_LOGO') document.getElementById('logo-overlay').style.display = data ? 'block' : 'none';
      if (type === 'UPDATE_LOGO_SRC') document.getElementById('logo-overlay').style.backgroundImage = `url('${data}')`;
      if (type === 'UPDATE_BG_IMAGE') {
        document.getElementById('bg-video').style.display = 'none';
        document.getElementById('display-stage').style.backgroundImage = `url('${data}')`;
      }
      if (type === 'UPDATE_BG_VIDEO') {
        const video = document.getElementById('bg-video');
        document.getElementById('display-stage').style.backgroundImage = 'none';
        video.src = data;
        video.style.display = 'block';
        video.play();
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'presentation') {
      document.body.classList.add('presentation-mode');
    }
  </script>
</body>
</html>
