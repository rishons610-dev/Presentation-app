<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VerseView Mobile Pro</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background-color: var(--panel);
      padding: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .app-container { display: flex; flex-direction: column; flex: 1; padding: 0.5rem; gap: 0.75rem; overflow-y: auto; }

    /* Navigation Tabs */
    .tab-bar { display: flex; gap: 0.25rem; background: #0f172a; padding: 0.25rem; border-radius: 6px; overflow-x: auto; }
    .tab-btn {
      flex: 1;
      min-width: 65px;
      padding: 0.6rem 0.2rem;
      font-size: 0.75rem;
      font-weight: bold;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 4px;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: white; }

    .tab-content { display: none; background: var(--panel); padding: 1rem; border-radius: 8px; }
    .tab-content.active { display: block; }

    label { display: block; font-size: 0.8rem; margin: 0.5rem 0 0.25rem; color: #cbd5e1; }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem;
      margin-bottom: 0.5rem;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.9rem;
    }

    /* Color Swatch Grid */
    .color-palette {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }
    .swatch {
      height: 36px;
      border-radius: 6px;
      border: 2px solid #334155;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.2s ease;
    }
    .swatch:active { transform: scale(0.92); }
    .swatch.selected { border-color: #ffffff; box-shadow: 0 0 8px rgba(255,255,255,0.6); }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem; }

    button.action-btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.accent { background: var(--accent); }
    button.warning { background: var(--warning); }
    button.danger { background: var(--danger); }

    /* Song & Schedule List Styles */
    .song-list, .schedule-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      margin-bottom: 0.5rem;
    }
    .song-item, .schedule-item {
      padding: 0.6rem;
      border-bottom: 1px solid #1e293b;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .song-item:hover, .schedule-item:hover { background: #1e293b; }
    .song-item:last-child, .schedule-item:last-child { border-bottom: none; }
    .type-badge {
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      font-weight: bold;
    }
    .badge-bible { background: var(--warning); color: #000; }
    .badge-song { background: var(--primary); color: #fff; }

    /* Stage Area */
    #stage-wrapper {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    /* Background Theme Presets */
    .bg-black { background: #000000 !important; }
    .bg-blue { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%) !important; }
    .bg-purple { background: linear-gradient(135deg, #2e1065 0%, #581c87 100%) !important; }
    .bg-gradient { background: linear-gradient(135deg, #065f46 0%, #0f172a 100%) !important; }

    #text-box {
      width: 90%;
      text-align: center;
      padding: 0.5rem;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .p-text { font-size: 1.2rem; font-weight: bold; color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); transition: color 0.2s ease; width: 100%; white-space: pre-line; }
    .s-text { font-size: 1rem; color: #fde047; margin-top: 0.25rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); transition: color 0.2s ease; width: 100%; white-space: pre-line; }
    
    .ref-text { 
      font-size: 0.85rem; 
      color: #cbd5e1; 
      font-style: italic;
      display: inline-block;
      transition: all 0.2s ease;
      margin: 0.5rem 0;
    }

    .ref-text.has-box {
      background-color: #2563eb;
      color: #ffffff;
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      font-style: normal;
      font-weight: bold;
    }

    /* Reference Positioning */
    .pos-bottom { order: 3; }
    .pos-top { order: -1; }

    /* Output Overlay Button */
    #fs-toggle-btn {
      display: none;
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      padding: 0.5rem 1rem;
      background: rgba(37, 99, 235, 0.8);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: opacity 0.2s ease;
    }
    #fs-toggle-btn:hover { background: rgba(37, 99, 235, 1); }

    /* Presentation Mode Adjustments */
    body.presentation-mode header,
    body.presentation-mode .tab-bar,
    body.presentation-mode .tab-content { display: none !important; }
    body.presentation-mode { overflow: hidden; background: #000; justify-content: center; align-items: center; }
    body.presentation-mode .app-container { padding: 0; width: 100vw; height: 100vh; justify-content: center; align-items: center; }
    body.presentation-mode #stage-wrapper { width: 100vw; height: 100vh; border-radius: 0; aspect-ratio: auto; }
    body.presentation-mode #fs-toggle-btn { display: block; }
    
    /* Auto-hide presentation overlay button in fullscreen mode */
    :fullscreen #fs-toggle-btn { opacity: 0; }
    :fullscreen #fs-toggle-btn:hover { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <h3 style="font-size: 1rem;">VerseView Mobile Pro</h3>
    <button onclick="launchOutput()" style="padding: 0.4rem 0.8rem; background: var(--accent); color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 0.75rem; cursor: pointer;">
      📺 Open Output
    </button>
  </header>

  <div class="app-container">
    
    <!-- Tab Controls -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="showTab('bible', this)">Bible</button>
      <button class="tab-btn" onclick="showTab('songs', this)">Songs</button>
      <button class="tab-btn" onclick="showTab('schedule', this)">📅 Schedules</button>
      <button class="tab-btn" onclick="showTab('versions', this)">Bibles +</button>
      <button class="tab-btn" onclick="showTab('colors', this)">Fonts & Colors</button>
      <button class="tab-btn" onclick="showTab('quick', this)">Presets</button>
      <button class="tab-btn" onclick="showTab('display', this)">Theme</button>
    </div>

    <!-- 1. Bible Section -->
    <div id="tab-bible" class="tab-content active">
      <label>Primary Translation</label>
      <select id="p-version-select" onchange="renderVerse()"></select>

      <label>Secondary Translation</label>
      <select id="s-version-select" onchange="renderVerse()">
        <option value="none">None (Single Version)</option>
      </select>

      <label>Select Passage / Verse</label>
      <select id="verse-picker" onchange="renderVerse()">
        <option value="j316">John 3:16</option>
        <option value="p231">Psalm 23:1</option>
        <option value="g11">Genesis 1:1</option>
        <option value="p119">Psalm 119:105</option>
      </select>

      <div class="btn-grid">
        <button class="action-btn warning" onclick="renderVerse()">Show Verse</button>
        <button class="action-btn accent" onclick="addVerseToSchedule()">➕ Add Verse to Schedule</button>
      </div>
      <button class="action-btn danger" style="margin-top: 0.5rem;" onclick="blankScreen()">Blackout Screen</button>
    </div>

    <!-- 2. Song Library -->
    <div id="tab-songs" class="tab-content">
      <label style="font-weight: bold; color: var(--accent);">🎵 Song Library & Search</label>
      <input type="text" id="song-search" placeholder="🔍 Search saved songs..." oninput="filterSongs()">
      
      <div class="song-list" id="song-list-container"></div>

      <button class="action-btn accent" style="margin-bottom: 0.75rem;" onclick="addActiveSongToSchedule()">➕ Add Active Song to Schedule</button>

      <hr style="border-color: #334155; margin: 0.75rem 0;">

      <label style="font-weight: bold; color: var(--accent);">🌐 Dual-Language Lyric Slide Generator</label>
      <label>Song Title</label>
      <input type="text" id="song-title-input" placeholder="e.g., Amazing Grace / Sublime Gracia">

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
        <div>
          <label style="font-weight: bold; color: #38bdf8;">Language 1 (Primary)</label>
          <textarea id="lyrics-primary-input" rows="5" placeholder="Verse 1 Line 1&#10;Verse 1 Line 2&#10;&#10;Verse 2 Line 1&#10;Verse 2 Line 2"></textarea>
        </div>
        <div>
          <label style="font-weight: bold; color: #fde047;">Language 2 (Secondary)</label>
          <textarea id="lyrics-secondary-input" rows="5" placeholder="Verso 1 Línea 1&#10;Verso 1 Línea 2&#10;&#10;Verso 2 Línea 1&#10;Verso 2 Línea 2"></textarea>
        </div>
      </div>

      <div class="btn-grid">
        <button class="action-btn accent" onclick="generateAndSaveSong()">💾 Save Song</button>
        <button class="action-btn warning" onclick="generateSlidesFromText()">⚡ Project Direct</button>
      </div>

      <div id="slide-nav-box" style="margin-top: 0.75rem; display: none; background: #0f172a; padding: 0.5rem; border-radius: 6px; border: 1px solid #334155;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <span style="font-size: 0.8rem; color: #cbd5e1;" id="active-song-title">Active Song</span>
          <span style="font-size: 0.8rem; font-weight: bold; color: var(--accent);" id="slide-indicator">Slide 1 / 1</span>
        </div>
        <div class="btn-grid">
          <button class="action-btn" onclick="prevSlide()">⬅ Prev Slide</button>
          <button class="action-btn" onclick="nextSlide()">Next Slide ➡</button>
        </div>
      </div>
    </div>

    <!-- 3. Schedules Manager -->
    <div id="tab-schedule" class="tab-content">
      <label style="font-weight: bold; color: var(--accent);">📅 Program Schedule Manager</label>

      <label>Active Schedule Profile</label>
      <select id="schedule-select" onchange="switchScheduleProfile()"></select>

      <div class="btn-grid" style="margin-bottom: 0.75rem;">
        <button class="action-btn accent" onclick="createScheduleProfile()">✨ New Schedule</button>
        <button class="action-btn danger" onclick="deleteCurrentSchedule()">🗑️ Delete Schedule</button>
      </div>

      <label style="font-weight: bold;">Scheduled Order of Service Items</label>
      <div class="schedule-list" id="schedule-list-container"></div>

      <button class="action-btn danger" onclick="clearScheduleItems()">🧹 Clear All Items from Active Schedule</button>
    </div>

    <!-- 4. Custom Bible Version Builder -->
    <div id="tab-versions" class="tab-content">
      <label>Version Code (e.g., NIV, KJV, NVI, ESV)</label>
      <input type="text" id="v-code" placeholder="e.g. NIV">

      <label>Version Name</label>
      <input type="text" id="v-name" placeholder="e.g. New International Version">

      <label style="margin-top:0.5rem; font-weight:bold;">Custom Verse Samples for Version</label>

      <label>John 3:16 Text</label>
      <textarea id="v-j316" rows="2" placeholder="Text for John 3:16..."></textarea>

      <label>Psalm 23:1 Text</label>
      <textarea id="v-p231" rows="2" placeholder="Text for Psalm 23:1..."></textarea>

      <button class="action-btn accent" onclick="saveCustomVersion()">💾 Save Custom Bible Version</button>
    </div>

    <!-- 5. Font Colors & Style Settings -->
    <div id="tab-colors" class="tab-content">
      <label>Font Family Selection</label>
      <select id="font-family-select" onchange="applyFontFamily(this.value)">
        <option value="system-ui">Default System</option>
        <option value="Georgia, serif">Georgia (Serif)</option>
        <option value="'Courier New', monospace">Courier (Monospace)</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
      </select>

      <label style="margin-top: 0.5rem;">Upload Custom Font File (.ttf, .otf, .woff)</label>
      <input type="file" id="font-file-input" accept=".ttf,.otf,.woff,.woff2" onchange="uploadCustomFont(event)">

      <hr style="border-color: #334155; margin: 0.75rem 0;">

      <label style="font-weight: bold; color: var(--accent);">Reference Header Box Settings</label>
      
      <label>Reference Position</label>
      <select id="ref-pos-select" onchange="updateRefSettings()">
        <option value="pos-bottom">Bottom (Below Verse)</option>
        <option value="pos-top">Top (Above Verse Header)</option>
      </select>

      <label>Header Style Mode</label>
      <select id="ref-style-mode" onchange="updateRefSettings()">
        <option value="plain">Plain Text</option>
        <option value="box">Header Box Background</option>
      </select>

      <div id="header-box-controls" style="display: none;">
        <label>Header Box Background Color</label>
        <input type="color" id="box-bg-color" value="#2563eb" onchange="updateRefSettings()">

        <label>Header Text Color</label>
        <input type="color" id="box-text-color" value="#ffffff" onchange="updateRefSettings()">

        <label>Header Box Shape (Border Radius)</label>
        <select id="box-shape" onchange="updateRefSettings()">
          <option value="0px">Sharp Square</option>
          <option value="6px">Rounded Corners</option>
          <option value="20px">Pill / Capsule Shape</option>
        </select>

        <label>Header Margins / Vertical Spacing (px)</label>
        <input type="range" id="box-margin" min="0" max="30" value="8" oninput="updateRefSettings()">
      </div>

      <hr style="border-color: #334155; margin: 0.75rem 0;">

      <label>Primary Text Color Palette</label>
      <div class="color-palette" id="p-palette">
        <div class="swatch selected" style="background: #ffffff;" onclick="selectColor('p', '#ffffff', this)"></div>
        <div class="swatch" style="background: #fde047;" onclick="selectColor('p', '#fde047', this)"></div>
        <div class="swatch" style="background: #38bdf8;" onclick="selectColor('p', '#38bdf8', this)"></div>
        <div class="swatch" style="background: #4ade80;" onclick="selectColor('p', '#4ade80', this)"></div>
        <div class="swatch" style="background: #fb7185;" onclick="selectColor('p', '#fb7185', this)"></div>
      </div>
      <input type="color" id="p-custom-color" value="#ffffff" onchange="selectColor('p', this.value)" style="height: 40px;">

      <label style="margin-top:0.75rem;">Secondary Text Color Palette</label>
      <div class="color-palette" id="s-palette">
        <div class="swatch" style="background: #ffffff;" onclick="selectColor('s', '#ffffff', this)"></div>
        <div class="swatch selected" style="background: #fde047;" onclick="selectColor('s', '#fde047', this)"></div>
        <div class="swatch" style="background: #38bdf8;" onclick="selectColor('s', '#38bdf8', this)"></div>
        <div class="swatch" style="background: #4ade80;" onclick="selectColor('s', '#4ade80', this)"></div>
        <div class="swatch" style="background: #fb7185;" onclick="selectColor('s', '#fb7185', this)"></div>
      </div>
      <input type="color" id="s-custom-color" value="#fde047" onchange="selectColor('s', this.value)" style="height: 40px;">
    </div>

    <!-- 6. Presets -->
    <div id="tab-quick" class="tab-content">
      <label>Quick Stage Slides</label>
      <div class="btn-grid">
        <button class="action-btn" onclick="sendPreset('Welcome to Service!', '¡Bienvenidos al Servicio!', 'Opening Slide')">👋 Welcome</button>
        <button class="action-btn" onclick="sendPreset('Praise & Worship', 'Alabanza y Adoración', 'Service Title')">🎵 Worship</button>
        <button class="action-btn" onclick="sendPreset('Amen & Hallelujah!', '¡Amén y Aleluya!', 'Congregational')">🙌 Amen Slide</button>
        <button class="action-btn" onclick="sendPreset('God Bless You!', '¡Dios te Bendiga!', 'Benediction')">🙏 Closing</button>
      </div>
    </div>

    <!-- 7. Background Theme & Display Settings -->
    <div id="tab-display" class="tab-content">
      <label>Stage Background Theme</label>
      <select id="bg-theme" onchange="changeTheme()">
        <option value="bg-black">Solid Black</option>
        <option value="bg-blue">Deep Ocean Blue</option>
        <option value="bg-purple">Royal Purple Gradient</option>
        <option value="bg-gradient">Emerald Glow</option>
      </select>
    </div>

    <!-- Preview Stage / Output Window -->
    <div id="stage-wrapper" class="bg-black">
      <button id="fs-toggle-btn" onclick="toggleFullscreen()">📺 Fullscreen Screen (F)</button>
      <div id="text-box">
        <div id="out-p" class="p-text">For God so loved the world...</div>
        <div id="out-s" class="s-text">Porque de tal manera amó Dios al mundo...</div>
        <div id="out-r" class="ref-text pos-bottom">John 3:16 (KJV / RVR)</div>
      </div>
    </div>

  </div>

  <script>
    let bibleVersions = JSON.parse(localStorage.getItem('custom_bible_versions')) || {
      KJV: {
        name: "King James Version (English)",
        passages: {
          j316: "For God so loved the world, that he gave his only begotten Son...",
          p231: "The LORD is my shepherd; I shall not want.",
          g11: "In the beginning God created the heaven and the earth.",
          p119: "Thy word is a lamp unto my feet, and a light unto my path."
        }
      },
      RVR: {
        name: "Reina-Valera 1960 (Spanish)",
        passages: {
          j316: "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito...",
          p231: "Jehová es mi pastor; nada me faltará.",
          g11: "En el principio creó Dios los cielos y la tierra.",
          p119: "Lámpara es a mis pies tu palabra, y lumbrera a mi camino."
        }
      }
    };

    let songLibrary = JSON.parse(localStorage.getItem('custom_song_library')) || [
      {
        title: "Amazing Grace",
        slides: [
          { p: "Amazing grace! How sweet the sound\nThat saved a wretch like me!", s: "Sublime gracia del Señor\nQue a un pecador salvó" },
          { p: "I once was lost, but now am found;\nWas blind, but now I see.", s: "Fui ciego mas hoy veo yo\nPerdido fui mas hoy" },
          { p: "'Twas grace that taught my heart to fear,\nAnd grace my fears relieved;", s: "Su gracia me enseñó a temer\nY m      overflow-y: auto;
      border-right: 1px solid #334155;
    }

    .card {
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .card h3 { font-size: 0.85rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 0.75rem; letter-spacing: 0.05em; }

    label { display: block; font-size: 0.8rem; margin-bottom: 0.25rem; color: #cbd5e1; }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 0.75rem;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 0.9rem;
    }

    button {
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 4px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.clear { background: #ef4444; }
    button.accent { background: var(--accent); }
    button.warning { background: #f59e0b; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    /* Output Stage */
    #display-stage {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
      background-color: #000;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, aspect-ratio 0.2s ease;
    }

    #bg-video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 1;
    }

    /* Target Bounding Box Area */
    #text-bounding-box {
      position: absolute;
      top: 10%; left: 5%; width: 90%; height: 80%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-sizing: border-box;
      border: 2px dashed transparent;
    }

    body.show-box-guides #text-bounding-box {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
    }

    #text-container {
      width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      white-space: normal;
      word-break: break-word;
    }

    .primary-text {
      font-weight: bold;
      margin-bottom: 0.25em;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      line-height: 1.2;
    }

    .secondary-text {
      opacity: 0.9;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      line-height: 1.2;
    }

    .reference-text {
      margin-top: 0.5em;
      font-size: 0.4em;
      font-style: italic;
      color: #cbd5e1;
    }

    #logo-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: contain;
      background-position: center;

  <script>
    const sampleBibles = {
      john316: { ref: "John 3:16", en: "For God so loved the world, that he gave his only begotten Son...", es: "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito..." },
      psalm231: { ref: "Psalm 23:1", en: "The LORD is my shepherd; I shall not want.", es: "Jehová es mi pastor; nada me faltará." },
      gen11: { ref: "Genesis 1:1", en: "In the beginning God created the heaven and the earth.", es: "En el principio creó Dios los cielos y la tierra." }
    };

    const channel = new BroadcastChannel("verseview_pro_channel");

    function switchTab(mode) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      ['bible', 'song', 'area', 'media'].forEach(m => {
        document.getElementById('section-' + m).style.display = 'none';
      });

      document.getElementById('tab-' + mode).classList.add('active');
      document.getElementById('section-' + mode).style.display = 'block';
    }

    function toggleGuides() {
      document.body.classList.toggle('show-box-guides');
    }

    /* DISPLAY RATIO & FULLSCREEN LOGIC */
    function updateDisplayRatio() {
      const ratio = document.getElementById('aspect-ratio-select').value;
      const scale = document.getElementById('display-scale').value / 100;

      const data = { ratio, scale };
      applyDisplayRatio(data);
      channel.postMessage({ type: 'UPDATE_DISPLAY_RATIO', data });
    }

    function applyDisplayRatio(data) {
      const stage = document.getElementById('display-stage');
      if (!stage) return;

      if (data.ratio === 'fill') {
        stage.style.aspectRatio = 'unset';
        stage.style.width = '100vw';
        stage.style.height = '100vh';
      } else {
        stage.style.aspectRatio = data.ratio;
        stage.style.width = '100%';
        stage.style.height = 'auto';
      }

      stage.style.transform = `scale(${data.scale})`;
      autoScaleTextFont();
    }

    function triggerFullscreenOutput() {
      const stage = document.getElementById('display-stage');
      if (stage.requestFullscreen) {
        stage.requestFullscreen();
      } else if (stage.webkitRequestFullscreen) {
        stage.webkitRequestFullscreen();
      }
    }

    /* BIBLE & LYRICS LOGIC */
    function sendVerseToDisplay() {
      const selected = document.getElementById('verse-select').value;
      const pLang = document.getElementById('p-lang').value;
      const sLang = document.getElementById('s-lang').value;
      const item = sampleBibles[selected];

      const payload = {
        primary: item[pLang] || "",
        secondary: sLang !== "none" ? item[sLang] : "",
        ref: item.ref
      };

      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    function sendCustomLyric() {
      const primary = document.getElementById('custom-p').value;
      const secondary = document.getElementById('custom-s').value;

      const payload = { primary, secondary, ref: "Lyric Slide" };
      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    function clearDisplay() {
      const payload = { primary: "", secondary: "", ref: "" };
      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    /* MARKED BOUNDING BOX & AUTOMATED DYNAMIC FONT SCALING */
    function updateBoundingBox() {
      const box = {
        top: document.getElementById('box-top').value + '%',
        left: document.getElementById('box-left').value + '%',
        width: document.getElementById('box-width').value + '%',
        height: document.getElementById('box-height').value + '%'
      };

      applyBoundingBox(box);
      channel.postMessage({ type: 'UPDATE_BOX', data: box });
    }

    function applyBoundingBox(box) {
      const bbox = document.getElementById('text-bounding-box');
      bbox.style.top = box.top;
      bbox.style.left = box.left;
      bbox.style.width = box.width;
      bbox.style.height = box.height;
      autoScaleTextFont();
    }

    function autoScaleTextFont() {
      const container = document.getElementById('text-container');
      const box = document.getElementById('text-bounding-box');
      
      if (!container || !box) return;

      let fontSize = 10;
      container.style.fontSize = fontSize + 'px';

      while (
        container.scrollHeight <= box.clientHeight && 
        container.scrollWidth <= box.clientWidth && 
        fontSize < 120
      ) {
        fontSize += 2;
        container.style.fontSize = fontSize + 'px';
      }

      fontSize = Math.max(10, fontSize - 4);
      container.style.fontSize = fontSize + 'px';
    }

    /* LOCAL MEDIA & LOGO OVERLAY */
    function uploadLogo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const logoDataUrl = evt.target.result;
        document.getElementById('logo-overlay').style.backgroundImage = `url('${logoDataUrl}')`;
        channel.postMessage({ type: 'UPDATE_LOGO_SRC', data: logoDataUrl });
      };
      reader.readAsDataURL(file);
    }

    function toggleLogo(show) {
      document.getElementById('logo-overlay').style.display = show ? 'block' : 'none';
      channel.postMessage({ type: 'TOGGLE_LOGO', data: show });
    }

    function uploadBgImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const imgUrl = evt.target.result;
        const stage = document.getElementById('display-stage');
        const video = document.getElementById('bg-video');

        video.style.display = 'none';
        stage.style.backgroundImage = `url('${imgUrl}')`;

        channel.postMessage({ type: 'UPDATE_BG_IMAGE', data: imgUrl });
      };
      reader.readAsDataURL(file);
    }

    function uploadBgVideo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const videoUrl = URL.createObjectURL(file);
      const stage = document.getElementById('display-stage');
      const video = document.getElementById('bg-video');

      stage.style.backgroundImage = 'none';
      video.src = videoUrl;
      video.style.display = 'block';
      video.play();

      channel.postMessage({ type: 'UPDATE_BG_VIDEO', data: videoUrl });
    }

    /* CUSTOM FONTS & STYLING */
    function uploadCustomFont(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fontName = 'CustomFont_' + Date.now();
      const reader = new FileReader();

      reader.onload = function(evt) {
        const font = new FontFace(fontName, evt.target.result);
        font.load().then(loadedFont => {
          document.fonts.add(loadedFont);
          
          const select = document.getElementById('font-family');
          const option = new Option('Custom: ' + file.name, fontName);
          select.add(option);
          select.value = fontName;

          updateStyles();
        });
      };
      reader.readAsArrayBuffer(file);
    }

    function updateStyles() {
      const styles = {
        fontFamily: document.getElementById('font-family').value,
        pColor: document.getElementById('p-color').value,
        sColor: document.getElementById('s-color').value
      };

      applyStylesToStage(styles);
      channel.postMessage({ type: 'UPDATE_STYLES', data: styles });
    }

    function applyStylesToStage(styles) {
      const container = document.getElementById('text-container');
      const primaryText = document.getElementById('out-primary');
      const secondaryText = document.getElementById('out-secondary');

      if (styles.fontFamily) container.style.fontFamily = styles.fontFamily;
      if (styles.pColor) primaryText.style.color = styles.pColor;
      if (styles.sColor) secondaryText.style.color = styles.sColor;

      autoScaleTextFont();
    }

    function updateStage(data) {
      document.getElementById('out-primary').innerText = data.primary;
      document.getElementById('out-secondary').innerText = data.secondary;
      document.getElementById('out-ref').innerText = data.ref      overflow-y: auto;
      border-right: 1px solid #334155;
    }

    .card {
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .card h3 { font-size: 0.85rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 0.75rem; letter-spacing: 0.05em; }

    label { display: block; font-size: 0.8rem; margin-bottom: 0.25rem; color: #cbd5e1; }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 0.75rem;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 0.9rem;
    }

    button {
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 4px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.clear { background: #ef4444; }
    button.accent { background: var(--accent); }
    button.warning { background: #f59e0b; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    /* Output Stage */
    #display-stage {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
      background-color: #000;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    #bg-video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 1;
    }

    /* Target Bounding Box Area */
    #text-bounding-box {
      position: absolute;
      top: 10%; left: 5%; width: 90%; height: 80%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-sizing: border-border-box;
      border: 2px dashed dashed transparent;
    }

    body.show-box-guides #text-bounding-box {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
    }

    #text-container {
      width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      white-space: normal;
      word-break: break-word;
    }

    .primary-text {
      font-weight: bold;
      margin-bottom: 0.25em;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      line-height: 1.2;
    }

    .secondary-text {
      opacity: 0.9;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      line-height: 1.2;
    }

    .reference-text {
      margin-top: 0.5em;
      font-size: 0.4em;
      font-style: italic;
      color: #cbd5e1;
    }

    /* Logo Overlay Slide */
    #logo-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 10;
      display: none;
    }

    .modes { display: flex; gap: 0.5rem; }

    .tab-btn { flex: 1; background: #334155; padding: 0.5rem; font-size: 0.8rem; }

    <div class="main-content">
      <div id="display-stage">
        <video id="bg-video" autoplay loop muted playsinline></video>
        <div class="overlay"></div>
        <div id="logo-overlay"></div>

        <!-- Marked Text Bounding Area -->

        <div id="text-bounding-box">
          <div id="text-container">
            <div id="out-primary" class="primary-text">For God so loved the world...</div>
            <div id="out-secondary" class="secondary-text">Porque de tal manera amó Dios al mundo...</div>
            <div id="out-ref" class="reference-text">John 3:16</div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    const sampleBibles = {
      john316: { ref: "John 3:16", en: "For God so loved the world, that he gave his only begotten Son...", es: "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito..." },
      psalm231: { ref: "Psalm 23:1", en: "The LORD is my shepherd; I shall not want.", es: "Jehová es mi pastor; nada me faltará." },
      gen11: { ref: "Genesis 1:1", en: "In the beginning God created the heaven and the earth.", es: "En el principio creó Dios los cielos y la tierra." }
    };

    const channel = new BroadcastChannel("verseview_pro_channel");

    function switchTab(mode) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      ['bible', 'song', 'area', 'media'].forEach(m => {
        document.getElementById('section-' + m).style.display = 'none';
      });

      document.getElementById('tab-' + mode).classList.add('active');
      document.getElementById('section-' + mode).style.display = 'block';
    }

    function toggleGuides() {
      document.body.classList.toggle('show-box-guides');
    }

    /* BIBLE & LYRICS LOGIC */

    function sendVerseToDisplay() {
      const selected = document.getElementById('verse-select').value;
      const pLang = document.getElementById('p-lang').value;
      const sLang = document.getElementById('s-lang').value;
      const item = sampleBibles[selected];

      const payload = {
        primary: item[pLang] || "",
        secondary: sLang !== "none" ? item[sLang] : "",
        ref: item.ref
      };

      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    function sendCustomLyric() {
      const primary = document.getElementById('custom-p').value;
      const secondary = document.getElementById('custom-s').value;

      const payload = { primary, secondary, ref: "Lyric Slide" };
      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    function clearDisplay() {
      const payload = { primary: "", secondary: "", ref: "" };
      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    /* MARKED BOUNDING BOX & AUTOMATED DYNAMIC FONT SCALING */

    function updateBoundingBox() {
      const box = {
        top: document.getElementById('box-top').value + '%',
        left: document.getElementById('box-left').value + '%',
        width: document.getElementById('box-width').value + '%',
        height: document.getElementById('box-height').value + '%'
      };

      applyBoundingBox(box);
      channel.postMessage({ type: 'UPDATE_BOX', data: box });
    }

    function applyBoundingBox(box) {
      const bbox = document.getElementById('text-bounding-box');
      bbox.style.top = box.top;
      bbox.style.left = box.left;
      bbox.style.width = box.width;
      bbox.style.height = box.height;
      autoScaleTextFont();
    }

    function autoScaleTextFont() {
      const container = document.getElementById('text-container');
      const box = document.getElementById('text-bounding-box');
      
      if (!container || !box) return;

      let fontSize = 10;
      container.style.fontSize = fontSize + 'px';

      // Dynamically scale font size up until text fills box or starts overflowing
      while (
        container.scrollHeight <= box.clientHeight && 
        container.scrollWidth <= box.clientWidth && 
        fontSize < 120
      ) {
        fontSize += 2;
        container.style.fontSize = fontSize + 'px';
      }

      // Step back down slightly to prevent clipping
      fontSize = Math.max(10, fontSize - 4);
      container.style.fontSize = fontSize + 'px';
    }

    /* LOCAL MEDIA & LOGO OVERLAY */

    function uploadLogo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const logoDataUrl = evt.target.result;
        document.getElementById('logo-overlay').style.backgroundImage = `url('${logoDataUrl}')`;
        channel.postMessage({ type: 'UPDATE_LOGO_SRC', data: logoDataUrl });
      };
      reader.readAsDataURL(file);
    }

    function toggleLogo(show) {
      document.getElementById('logo-overlay').style.display = show ? 'block' : 'none';
      channel.postMessage({ type: 'TOGGLE_LOGO', data: show });
    }

    function uploadBgImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const imgUrl = evt.target.result;
        const stage = document.getElementById('display-stage');
        const video = document.getElementById('bg-video');

        video.style.display = 'none';
        stage.style.backgroundImage = `url('${imgUrl}')`;

        channel.postMessage({ type: 'UPDATE_BG_IMAGE', data: imgUrl });
      };
      reader.readAsDataURL(file);
    }

    function uploadBgVideo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const videoUrl = URL.createObjectURL(file);
      const stage = document.getElementById('display-stage');
      const video = document.getElementById('bg-video');

      stage.style.backgroundImage = 'none';
      video.src = videoUrl;
      video.style.display = 'block';
      video.play();

      channel.postMessage({ type: 'UPDATE_BG_VIDEO', data: videoUrl });
    }

    /* CUSTOM FONTS & STYLING */

    function uploadCustomFont(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fontName = 'CustomFont_' + Date.now();
      const reader = new FileReader();

      reader.onload = function(evt) {
        const font = new FontFace(fontName, evt.target.result);
        font.load().then(loadedFont => {
          document.fonts.add(loadedFont);
          
          const select = document.getElementById('font-family');
          const option = new Option('Custom: ' + file.name, fontName);
          select.add(option);
          select.value = fontName;

          updateStyles();
        });
      };
      reader.readAsArrayBuffer(file);
    }

    function updateStyles() {
      const styles = {
        fontFamily: document.getElementById('font-family').value,
        pColor: document.getElementById('p-color').value,
        sColor: document.getElementById('s-color').value
      };

      applyStylesToStage(styles);
      channel.postMessage({ type: 'UPDATE_STYLES', data: styles });
    }

    function applyStylesToStage(styles) {
      const container = document.getElementById('text-container');
      const primaryText = document.getElementById('out-primary');
      const secondaryText = document.getElementById('out-secondary');

      if (styles.fontFamily) container.style.fontFamily = styles.fontFamily;
      if (styles.pColor) primaryText.style.color = styles.pColor;
      if (styles.sColor) secondaryText.style.color = styles.sColor;

      autoScaleTextFont();
    }

    function updateStage(data) {
      document.getElementById('out-primary').innerText = data.primary;
      document.getElementById('out-secondary').innerText = data.secondary;
      document.getElementById('out-ref').innerText = data.ref;
      autoScaleTextFont();
    }

    function openPresentationWindow() {
      const url = window.location.href.split('?')[0] + '?mode=presentation';
      window.open(url, '_blank');
    }

    window.addEventListener('resize', autoScaleTextFont);

    /* CROSS-TAB SYNC LISTENER */

    channel.onmessage = (event) => {
      const { type, data } = event.data;
      if (type === 'UPDATE_CONTENT') updateStage(data);
      if (type === 'UPDATE_STYLES') applyStylesToStage(data);
      if (type === 'UPDATE_BOX') applyBoundingBox(data);
      if (type === 'TOGGLE_LOGO') document.getElementById('logo-overlay').style.display = data ? 'block' : 'none';
      if (type === 'UPDATE_LOGO_SRC') document.getElementById('logo-overlay').style.backgroundImage = `url('${data}')`;
      if (type === 'UPDATE_BG_IMAGE') {
        document.getElementById('bg-video').style.display = 'none';
        document.getElementById('display-stage').style.backgroundImage = `url('${data}')`;
      }
      if (type === 'UPDATE_BG_VIDEO') {
        const video = document.getElementById('bg-video');
        document.getElementById('display-stage').style.backgroundImage = 'none';
        video.src = data;
        video.style.display = 'block';
        video.play();
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'presentation') {
      document.body.classList.add('presentation-mode');
    }
  </script>
</body>
</html>
