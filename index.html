<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilingual Presentation App - VerseView Pro</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --accent: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

    header {
      background-color: var(--panel);
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .app-container { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 420px;
      background: var(--panel);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      border-right: 1px solid #334155;
    }

    .card {
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .card h3 { font-size: 0.85rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 0.75rem; letter-spacing: 0.05em; }

    label { display: block; font-size: 0.8rem; margin-bottom: 0.25rem; color: #cbd5e1; }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 0.75rem;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 0.9rem;
    }

    button {
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 4px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.clear { background: #ef4444; }
    button.accent { background: var(--accent); }
    button.warning { background: #f59e0b; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    /* Output Stage */
    #display-stage {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
      background-color: #000;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    #bg-video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 1;
    }

    /* Target Bounding Box Area */
    #text-bounding-box {
      position: absolute;
      top: 10%; left: 5%; width: 90%; height: 80%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-sizing: border-border-box;
      border: 2px dashed dashed transparent;
    }

    body.show-box-guides #text-bounding-box {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
    }

    #text-container {
      width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      white-space: normal;
      word-break: break-word;
    }

    .primary-text {
      font-weight: bold;
      margin-bottom: 0.25em;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      line-height: 1.2;
    }

    .secondary-text {
      opacity: 0.9;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      line-height: 1.2;
    }

    .reference-text {
      margin-top: 0.5em;
      font-size: 0.4em;
      font-style: italic;
      color: #cbd5e1;
    }

    /* Logo Overlay Slide */
    #logo-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 10;
      display: none;
    }

    .modes { display: flex; gap: 0.5rem; }

    .tab-btn { flex: 1; background: #334155; padding: 0.5rem; font-size: 0.8rem; }
    .tab-btn.active { background: var(--primary); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    /* Presentation Screen Mode */
    body.presentation-mode .sidebar,
    body.presentation-mode header { display: none !important; }
    body.presentation-mode .main-content { padding: 0; }
    body.presentation-mode #display-stage {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <header>
    <h2>VerseView Web Pro</h2>
    <div>
      <button onclick="openPresentationWindow()" style="width: auto; padding: 0.5rem 1rem; background: var(--accent);">
        📺 Launch Output Screen
      </button>
    </div>
  </header>

  <div class="app-container">
    <div class="sidebar">
      
      <!-- Navigation Tabs -->
      <div class="modes">
        <button id="tab-bible" class="tab-btn active" onclick="switchTab('bible')">Bible</button>
        <button id="tab-song" class="tab-btn" onclick="switchTab('song')">Songs</button>

        <button id="tab-area" class="tab-btn" onclick="switchTab('area')">Area & Font</button>
        <button id="tab-media" class="tab-btn" onclick="switchTab('media')">Media & Logo</button>
      </div>

      <!-- BIBLE SECTION -->
      <div id="section-bible" class="card">
        <h3>Bible Presentation</h3>
        <label>Primary Translation</label>
        <select id="p-lang" onchange="loadVerses()">
          <option value="en">English (KJV)</option>
          <option value="es">Spanish (RVR)</option>
        </select>

        <label>Secondary Translation</label>

        <select id="s-lang" onchange="loadVerses()">
          <option value="none">None</option>
          <option value="es" selected>Spanish (RVR)</option>
          <option value="en">English (KJV)</option>
        </select>

        <label>Select Verse</label>

        <select id="verse-select" onchange="sendVerseToDisplay()">
          <option value="john316">John 3:16</option>
          <option value="psalm231">Psalm 23:1</option>
          <option value="gen11">Genesis 1:1</option>
        </select>
      </div>

      <!-- SONGS SECTION -->

      <div id="section-song" class="card" style="display: none;">
        <h3>Custom Lyrics</h3>
        <label>Primary Language Slide</label>
        <textarea id="custom-p" rows="3" placeholder="Primary lyrics text..."></textarea>

        <label>Secondary Language Slide</label>
        <textarea id="custom-s" rows="3" placeholder="Secondary translation line..."></textarea>

        
        <button onclick="sendCustomLyric()">Project Live</button>
      </div>

      <!-- MARKED AREA & DYNAMIC FONT SECTION -->

      <div id="section-area" class="card" style="display: none;">
        <h3>Marked Output Text Area</h3>
        
        <label>Show Area Guides on Preview</label>

        <button class="warning" onclick="toggleGuides()" style="margin-bottom:0.75rem;">Toggle Area Guide Box</button>

        <div class="grid-2">
          <div>
            <label>Top Position (%)</label>
            <input type="range" id="box-top" min="0" max="80" value="10" oninput="updateBoundingBox()">
          </div>

          <div>
            <label>Left Position (%)</label>
            <input type="range" id="box-left" min="0" max="80" value="5" oninput="updateBoundingBox()">
          </div>

          <div>
            <label>Width (%)</label>
            <input type="range" id="box-width" min="20" max="100" value="90" oninput="updateBoundingBox()">
          </div>

          <div>
            <label>Height (%)</label>
            <input type="range" id="box-height" min="20" max="100" value="80" oninput="updateBoundingBox()">
          </div>

        </div>

        <hr style="border-color: #334155; margin: 0.75rem 0;">

        <h3>Custom Fonts</h3>
        <label>Font Family Selection</label>
        <select id="font-family" onchange="updateStyles()">

          <option value="system-ui">Default System</option>
          <option value="Georgia, serif">Georgia (Serif)</option>
          <option value="'Courier New', monospace">Courier (Monospace)</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet</option>

        </select>

        <label>Upload Custom Font File (.ttf, .otf, .woff)</label>

        <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2" onchange="uploadCustomFont(event)">

        <label>Primary Text Color</label>
        <input type="color" id="p-color" value="#ffffff" onchange="updateStyles()">

        <label>Secondary Text Color</label>

        <input type="color" id="s-color" value="#fde047" onchange="updateStyles()">
      </div>

      <!-- MEDIA & LOGO SECTION -->

      <div id="section-media" class="card" style="display: none;">
        <h3>Instant Logo Slide</h3>
        
        <div class="grid-2" style="margin-bottom: 0.75rem;">
          <button class="accent" onclick="toggleLogo(true)">Show Logo</button>

          <button class="clear" onclick="toggleLogo(false)">Hide Logo</button>

        </div>

        <label>Upload Church / Ministry Logo</label>
        <input type="file" id="logo-file" accept="image/*" onchange="uploadLogo(event)">

        <hr style="border-color: #334155; margin: 0.75rem 0;">

        <h3>Local Storage Media Backgrounds</h3>
        
        <label>Upload Custom Image Background</label>

        <input type="file" id="bg-image-file" accept="image/*" onchange="uploadBgImage(event)">

        <label>Upload Custom Video Background (MP4/WebM)</label>

        <input type="file" id="bg-video-file" accept="video/mp4,video/webm" onchange="uploadBgVideo(event)">

        <button class="clear" onclick="clearDisplay()">Clear Live Text</button>

      </div>

    </div>

    <!-- Live Stage Preview -->

    <div class="main-content">
      <div id="display-stage">
        <video id="bg-video" autoplay loop muted playsinline></video>
        <div class="overlay"></div>
        <div id="logo-overlay"></div>

        <!-- Marked Text Bounding Area -->

        <div id="text-bounding-box">
          <div id="text-container">
            <div id="out-primary" class="primary-text">For God so loved the world...</div>
            <div id="out-secondary" class="secondary-text">Porque de tal manera amó Dios al mundo...</div>
            <div id="out-ref" class="reference-text">John 3:16</div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    const sampleBibles = {
      john316: { ref: "John 3:16", en: "For God so loved the world, that he gave his only begotten Son...", es: "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito..." },
      psalm231: { ref: "Psalm 23:1", en: "The LORD is my shepherd; I shall not want.", es: "Jehová es mi pastor; nada me faltará." },
      gen11: { ref: "Genesis 1:1", en: "In the beginning God created the heaven and the earth.", es: "En el principio creó Dios los cielos y la tierra." }
    };

    const channel = new BroadcastChannel("verseview_pro_channel");

    function switchTab(mode) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      ['bible', 'song', 'area', 'media'].forEach(m => {
        document.getElementById('section-' + m).style.display = 'none';
      });

      document.getElementById('tab-' + mode).classList.add('active');
      document.getElementById('section-' + mode).style.display = 'block';
    }

    function toggleGuides() {
      document.body.classList.toggle('show-box-guides');
    }

    /* BIBLE & LYRICS LOGIC */

    function sendVerseToDisplay() {
      const selected = document.getElementById('verse-select').value;
      const pLang = document.getElementById('p-lang').value;
      const sLang = document.getElementById('s-lang').value;
      const item = sampleBibles[selected];

      const payload = {
        primary: item[pLang] || "",
        secondary: sLang !== "none" ? item[sLang] : "",
        ref: item.ref
      };

      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    function sendCustomLyric() {
      const primary = document.getElementById('custom-p').value;
      const secondary = document.getElementById('custom-s').value;

      const payload = { primary, secondary, ref: "Lyric Slide" };
      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    function clearDisplay() {
      const payload = { primary: "", secondary: "", ref: "" };
      updateStage(payload);
      channel.postMessage({ type: 'UPDATE_CONTENT', data: payload });
    }

    /* MARKED BOUNDING BOX & AUTOMATED DYNAMIC FONT SCALING */

    function updateBoundingBox() {
      const box = {
        top: document.getElementById('box-top').value + '%',
        left: document.getElementById('box-left').value + '%',
        width: document.getElementById('box-width').value + '%',
        height: document.getElementById('box-height').value + '%'
      };

      applyBoundingBox(box);
      channel.postMessage({ type: 'UPDATE_BOX', data: box });
    }

    function applyBoundingBox(box) {
      const bbox = document.getElementById('text-bounding-box');
      bbox.style.top = box.top;
      bbox.style.left = box.left;
      bbox.style.width = box.width;
      bbox.style.height = box.height;
      autoScaleTextFont();
    }

    function autoScaleTextFont() {
      const container = document.getElementById('text-container');
      const box = document.getElementById('text-bounding-box');
      
      if (!container || !box) return;

      let fontSize = 10;
      container.style.fontSize = fontSize + 'px';

      // Dynamically scale font size up until text fills box or starts overflowing
      while (
        container.scrollHeight <= box.clientHeight && 
        container.scrollWidth <= box.clientWidth && 
        fontSize < 120
      ) {
        fontSize += 2;
        container.style.fontSize = fontSize + 'px';
      }

      // Step back down slightly to prevent clipping
      fontSize = Math.max(10, fontSize - 4);
      container.style.fontSize = fontSize + 'px';
    }

    /* LOCAL MEDIA & LOGO OVERLAY */

    function uploadLogo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const logoDataUrl = evt.target.result;
        document.getElementById('logo-overlay').style.backgroundImage = `url('${logoDataUrl}')`;
        channel.postMessage({ type: 'UPDATE_LOGO_SRC', data: logoDataUrl });
      };
      reader.readAsDataURL(file);
    }

    function toggleLogo(show) {
      document.getElementById('logo-overlay').style.display = show ? 'block' : 'none';
      channel.postMessage({ type: 'TOGGLE_LOGO', data: show });
    }

    function uploadBgImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const imgUrl = evt.target.result;
        const stage = document.getElementById('display-stage');
        const video = document.getElementById('bg-video');

        video.style.display = 'none';
        stage.style.backgroundImage = `url('${imgUrl}')`;

        channel.postMessage({ type: 'UPDATE_BG_IMAGE', data: imgUrl });
      };
      reader.readAsDataURL(file);
    }

    function uploadBgVideo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const videoUrl = URL.createObjectURL(file);
      const stage = document.getElementById('display-stage');
      const video = document.getElementById('bg-video');

      stage.style.backgroundImage = 'none';
      video.src = videoUrl;
      video.style.display = 'block';
      video.play();

      channel.postMessage({ type: 'UPDATE_BG_VIDEO', data: videoUrl });
    }

    /* CUSTOM FONTS & STYLING */

    function uploadCustomFont(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fontName = 'CustomFont_' + Date.now();
      const reader = new FileReader();

      reader.onload = function(evt) {
        const font = new FontFace(fontName, evt.target.result);
        font.load().then(loadedFont => {
          document.fonts.add(loadedFont);
          
          const select = document.getElementById('font-family');
          const option = new Option('Custom: ' + file.name, fontName);
          select.add(option);
          select.value = fontName;

          updateStyles();
        });
      };
      reader.readAsArrayBuffer(file);
    }

    function updateStyles() {
      const styles = {
        fontFamily: document.getElementById('font-family').value,
        pColor: document.getElementById('p-color').value,
        sColor: document.getElementById('s-color').value
      };

      applyStylesToStage(styles);
      channel.postMessage({ type: 'UPDATE_STYLES', data: styles });
    }

    function applyStylesToStage(styles) {
      const container = document.getElementById('text-container');
      const primaryText = document.getElementById('out-primary');
      const secondaryText = document.getElementById('out-secondary');

      if (styles.fontFamily) container.style.fontFamily = styles.fontFamily;
      if (styles.pColor) primaryText.style.color = styles.pColor;
      if (styles.sColor) secondaryText.style.color = styles.sColor;

      autoScaleTextFont();
    }

    function updateStage(data) {
      document.getElementById('out-primary').innerText = data.primary;
      document.getElementById('out-secondary').innerText = data.secondary;
      document.getElementById('out-ref').innerText = data.ref;
      autoScaleTextFont();
    }

    function openPresentationWindow() {
      const url = window.location.href.split('?')[0] + '?mode=presentation';
      window.open(url, '_blank');
    }

    window.addEventListener('resize', autoScaleTextFont);

    /* CROSS-TAB SYNC LISTENER */

    channel.onmessage = (event) => {
      const { type, data } = event.data;
      if (type === 'UPDATE_CONTENT') updateStage(data);
      if (type === 'UPDATE_STYLES') applyStylesToStage(data);
      if (type === 'UPDATE_BOX') applyBoundingBox(data);
      if (type === 'TOGGLE_LOGO') document.getElementById('logo-overlay').style.display = data ? 'block' : 'none';
      if (type === 'UPDATE_LOGO_SRC') document.getElementById('logo-overlay').style.backgroundImage = `url('${data}')`;
      if (type === 'UPDATE_BG_IMAGE') {
        document.getElementById('bg-video').style.display = 'none';
        document.getElementById('display-stage').style.backgroundImage = `url('${data}')`;
      }
      if (type === 'UPDATE_BG_VIDEO') {
        const video = document.getElementById('bg-video');
        document.getElementById('display-stage').style.backgroundImage = 'none';
        video.src = data;
        video.style.display = 'block';
        video.play();
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'presentation') {
      document.body.classList.add('presentation-mode');
    }
  </script>
</body>
</html>
